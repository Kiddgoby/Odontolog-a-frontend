<div class="login-wrapper">
    <div class="login-card">

        <div class="logo">
            <img src="logo.png" alt="DentalCare" />
        </div>

        <h1>DentalCare</h1>
        <p class="subtitle">Sistema de Gestió de Clínica Dental</p>

        <h2>Iniciar Sessió</h2>
        <p class="description">Introdueix les teves credencials per accedir al sistema</p>

        @if (errorMessage) {
        <div class="error-msg">
            {{ errorMessage }}
        </div>
        }

        <form [formGroup]="loginForm" (ngSubmit)="handleLogin()">

            <label for="email">Correu Electrònic</label>
            <input id="email" type="email" formControlName="email" placeholder="usuari@clinica.com"/>

            <label for="password">Contrasenya</label>
            <input id="password" type="password" formControlName="password" placeholder="••••••••"/>

            <div class="remember">
                <input type="checkbox" id="remember" formControlName="remember"/>
                <label for="remember">Recordar el meu correu</label>
            </div>

            <button type="submit" [disabled]="isLoading">
                @if (isLoading) {
                    <span class="spinner"></span> Iniciant sessió...
                } @else {
                    Iniciar Sessió
                }
            </button>
        </form>

    </div>
</div>
